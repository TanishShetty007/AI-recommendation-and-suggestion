{% extends 'layouts/base.html' %}

{% block title %}Page Not Found - ShopSmart AI{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center align-items-center min-vh-75">
        <div class="col-md-7 col-lg-6 text-center animate-on-scroll" data-animation="slide-up">
            <span class="display-1 fw-extrabold text-gradient mb-3 d-block"
                style="font-size: 8rem; font-family: var(--font-heading); font-weight: 800;">404</span>
            <div class="mb-4">
                <h3 class="fw-bold text-dark mb-2">Oops! Page Not Found</h3>
                <p class="text-secondary max-width-500 mx-auto">The link you followed might be broken, or the item page
                    has been removed from our scanning catalog indices.</p>
            </div>

            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('pages.index') }}" class="btn btn-gradient-primary px-4 py-3"><i
                        class="fas fa-home me-2"></i>Return Home</a>
                <a href="{{ url_for('pages.search') }}" class="btn btn-outline-custom px-4 py-3"><i
                        class="fas fa-search me-2"></i>Catalog Search</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
